[project]
name = "coulson"
version = "0.1.0"
description = "Колсон — локальный голосовой ассистент для macOS (Apple Silicon)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ollama>=0.6",
    "mlx-whisper>=0.4",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "torch>=2.3",
    "silero-vad>=5.1",
    "num2words>=0.5.13",
    "rapidfuzz>=3.9",
    "ddgs>=9.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pywebview>=5.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-Cocoa>=10.3",
    "pillow>=10.4",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Экспериментальный голос: Qwen3-TTS через MLX (клонирование британского тембра)
qwen3tts = ["mlx-audio>=0.2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
