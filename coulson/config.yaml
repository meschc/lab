# Настройки Колсона. Свои изменения лучше класть в config.local.yaml
# (он перекрывает этот файл и не попадает в git).

assistant:
  name: Колсон
  # Варианты, в которые распознавание превращает имя. Сравнение нечёткое. Сменить имя: --rename «Имя».
  wake_words: [колсон, коулсон, колсан, колсен, колсона, колсону, колсоне, кулсон, coulson, colson, kolson, coulsen]
  wake_threshold: 85          # 0..100, чем выше — тем меньше ложных срабатываний
  listen_after_wake_seconds: 8  # сказал «Колсон» и замолчал — столько ждём команду
  followup_seconds: 8         # после ответа можно продолжать без «Колсон»
  followup_max: 2             # …но не больше двух реплик подряд (защита от зацикливания на ТВ/разговорах)
  fast_commands: true         # простые команды (громкость, пауза, «открой X», таймер) — без нейросети, мгновенно
  confirm_timeout_seconds: 15
  ack: chime                  # chime | voice — реакция на одиночное «Колсон»
  session_idle_minutes: 30    # после простоя контекст диалога сбрасывается (память остаётся)
  filler_after_seconds: 6     # если задача долгая — сказать «Минутку, работаю» (0 = не говорить)
  user_name: ""               # как обращаться: «Кирилл» (в напоминаниях и утренней сводке)

proactive:                    # инициатива: напоминания о днях рождения/событиях, утренняя сводка
  enabled: true
  briefing: true              # сводка (погода, события, дни рождения, задачи) — раз в день, при первом появлении
  briefing_from_hour: 6
  birthday_days: [7, 3, 1, 0] # за сколько дней напоминать о дне рождения
  event_minutes: [60, 15]     # за сколько минут — о событии календаря
  quiet_hours: [23, 8]        # сам не заговаривает (после команды — может)
  min_gap_minutes: 20         # не чаще раза в N минут
  present_idle_seconds: 300   # «ты за Маком» = был ввод за последние 5 минут и экран не заблокирован

location:
  use_system: true            # Службы геолокации macOS (точно, разрешение «Геолокация → Колсон»)
  home: ""                    # запасной вариант: «Москва» или «55.61, 37.72»
  home_country: RU            # по IP — только когда выход из этой страны (с VPN IP врёт)
  use_ip: true
  cache_minutes: 30

search:
  engine: auto                # auto: Yandex Search API, если настроен, иначе DuckDuckGo | yandex | ddg
  yandex_folder_id: ""        # Yandex Cloud → каталог; API-ключ — в Связке ключей (см. CLAUDE.md)
  region: 213                 # 213 — Москва

transit:                      # «Колсон, ближайшие автобусы от ЖК Ольховка до метро Домодедовская»
  city: Москва
  places: {}                  # {дом: "Москва, остановка ЖК Ольховка", работа: "…"} — в config.local.yaml
  wait_seconds: 4

power:
  keep_awake_on_ac: true      # на зарядке Мак не засыпает сам (экран гаснет как обычно); закрытая крышка = сон

audio:
  sample_rate: 16000
  device: null                # null = системный микрофон; иначе имя или номер (см. --check)
  vad_threshold: 0.5
  min_silence_ms: 700         # пауза, после которой фраза считается законченной
  speech_pad_ms: 800           # запас звука ДО начала речи — чтобы не обрезать первый слог «Колсон»
  min_speech_ms: 350
  max_segment_s: 25
  barge_in: true              # «Колсон, стоп» перебивает ответ (лучше работает в наушниках)

stt:
  engine: parakeet            # parakeet (быстро, почти не грузит GPU) | whisper (запасной)
  parakeet_model: mlx-community/parakeet-tdt-0.6b-v3
  min_confidence: 0.35        # ниже — считаем шумом (для parakeet)
  languages: [ru, en]
  # --- whisper ---
  model: mlx-community/whisper-large-v3-turbo
  initial_prompt: "Колсон, открой Стим. Колсон, включи ВПН. Coulson, open Safari."

llm:
  host: http://127.0.0.1:11434
  # Qwen3-VL 8B Instruct: зрение + инструменты в одной модели, обычная архитектура внимания —
  # Ollama кэширует постоянную часть промпта, поэтому ответ начинается ~за секунду.
  # (qwen3.5:9b умнее, но гибридная архитектура ломает кэш → 15–25 с на каждую реплику на M1 Pro.)
  model: qwen3-vl:8b-instruct
  vision_model: null          # null = та же модель (она мультимодальная)
  think: null                 # null = не передавать; для qwen3.5 обязательно false
  num_ctx: 12288
  temperature: 0.6
  keep_alive: 60m             # после часа простоя модель выгружается (~7 ГБ памяти)
  unload_on_game: true        # запустил игру — модель выгружается, память отдаётся игре
  max_tool_rounds: 20         # шагов (вызовов инструментов) на одну просьбу — для задач по плану
  history_turns: 10

tts:
  engine: silero              # silero | say | qwen3
  silero_model: v5_ru
  silero_speaker: aidar       # мужские: aidar, eugene
  sample_rate: 48000
  say_en_voice: Daniel        # британский голос macOS
  say_ru_voice: auto          # auto = лучший установленный русский голос macOS (запасной)
  say_rate: 190
  # --- экспериментально: Qwen3-TTS (uv sync --extra qwen3tts) ---
  qwen3_model: mlx-community/Qwen3-TTS-12Hz-0.6B-Base-bf16
  qwen3_ref_audio: null       # WAV-образец голоса для клонирования (scripts/make_voice_ref.sh)
  qwen3_ref_text: null

browser:
  app: Yandex                 # имя приложения браузера (/Applications/Yandex.app)

files:
  workspace: ~/Documents/Колсон   # куда сохраняются созданные файлы, если путь не указан

apps:
  aliases:                    # как ты называешь приложение -> как оно называется на диске
    телега: Telegram
    макс: MAX
    браузер: Yandex
    яндекс: Yandex
    музыка: Music
    терминал: Terminal
    настройки: System Settings

vpn:
  # auto — системные VPN-подключения macOS (scutil --nc): встроенные и приложения, добавившие себя в
  #        «Настройки → VPN» (WireGuard, Amnezia, v2rayTun, Outline…). shortcut — команды «<name> On/Off».
  #        app — просто запустить приложение.
  method: auto
  name: ""                    # имя подключения (узнать: «Колсон, покажи VPN-подключения»); пусто = первое
  forbidden_countries: [RU]   # выход через эти страны считается «VPN не работает»
  connect_timeout: 25         # сколько секунд ждать подключения

claude:
  binary: claude
  default_project: ~/Documents/Колсон   # папка, где Claude работает, если проект не назван
  projects:                   # «Колсон, попроси Клода в проекте <имя>…» → папка
    колсон: "@self"           # собственный код Колсона
    сайт: ~/lab
  # не нашёл в projects — ищет папку с похожим именем (и в латинице: «уклад» → uklad) здесь:
  project_roots: [~/Projects, ~/Developer, ~/Documents, ~/lab, ~/code, ~/Desktop, "~"]
  permission_mode: acceptEdits  # Claude сам правит файлы в папке проекта; прочие команды — только из списка ниже
  allowed_tools: [Read, Edit, Write, Glob, Grep, WebSearch, WebFetch, "Bash(uv run *)", "Bash(python3 *)",
                  "Bash(ls *)", "Bash(git status *)", "Bash(git diff *)", "Bash(git log *)"]
  max_turns: 40
  timeout_minutes: 30
  terminal: Terminal          # где открывать интерактивный Claude Code

messengers:                   # хоткей поиска контакта, если в твоей версии приложения он другой
  max: {app: MAX, search: "cmd+f"}
  telegram: {app: Telegram, search: "cmd+f"}
  whatsapp: {app: WhatsApp, search: "cmd+f"}

internal_browser:             # собственный браузер Колсона (Chromium), отдельный от твоего
  headless: false             # false — окно видно (можно войти на сайт); true — работает невидимо
  width: 1100
  height: 800
  close_after_minutes: 10     # закрывается после простоя, чтобы не занимать память

music:
  # Основной путь — API Яндекс Музыки через твой аккаунт («Колсон, подключи Яндекс Музыку»), играет mpv.
  # Ниже — запасной путь через браузер, если аккаунт не подключён:
  browser: internal           # internal — встроенный браузер Колсона; external — твой Яндекс Браузер
  shuffle_artist: false       # «включи Кино» — топ исполнителя по порядку (true — вперемешку)
  search_url: "https://music.yandex.ru/search?text={}"
  load_wait: 4                # секунд на загрузку страницы поиска перед кликом

self_review:
  analyzer: claude            # кто разбирает журнал ошибок: claude (Claude Code, нужен VPN) | local (своя модель)
  suggest_after: 5            # накопилось столько ошибок — Колсон сам предложит отдать их Клоду (0 — не предлагать)
  auto: false                 # разбирать журнал своей моделью в простое, без спроса
  min_incidents: 3
  idle_minutes: 5

safety:
  confirm_risky: true         # опасные действия только после голосового «да»

memory:
  max_facts: 40
  embed_model: qwen3-embedding:0.6b   # поиск по смыслу (~0.6 ГБ); null — только поиск по словам
  auto_recall: true           # подмешивать к каждой команде похожие записи из памяти
  recall_top_k: 3
  recall_min_similarity: 0.55 # 0..1: ниже — считаем не относящимся к делу

vision:
  max_width: 1440

ui:
  enabled: true
  position: top-right         # top-right | bottom-right
  collapse_after_seconds: 6
  mood_hold_seconds: 10       # сколько шар остаётся красноватым после плохой новости
