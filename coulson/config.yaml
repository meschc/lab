# Настройки Колсона. Свои изменения лучше класть в config.local.yaml
# (он перекрывает этот файл и не попадает в git).

assistant:
  name: Колсон
  # Варианты, в которые Whisper превращает «Колсон». Сравнение нечёткое.
  wake_words: [колсон, коулсон, колсан, колсен, колсона, колсону, колсоне, кулсон, coulson, colson, kolson, coulsen]
  wake_threshold: 85          # 0..100, чем выше — тем меньше ложных срабатываний
  listen_after_wake_seconds: 8  # сказал «Колсон» и замолчал — столько ждём команду
  followup_seconds: 8         # после ответа можно продолжать без «Колсон»
  followup_max: 2             # …но не больше двух реплик подряд (защита от зацикливания на ТВ/разговорах)
  fast_commands: true         # простые команды (громкость, пауза, «открой X», таймер) — без нейросети, мгновенно
  confirm_timeout_seconds: 15
  ack: chime                  # chime | voice — реакция на одиночное «Колсон»
  session_idle_minutes: 30    # после простоя контекст диалога сбрасывается (память остаётся)
  filler_after_seconds: 6     # если задача долгая — сказать «Минутку, работаю» (0 = не говорить)

audio:
  sample_rate: 16000
  device: null                # null = системный микрофон; иначе имя или номер (см. --check)
  vad_threshold: 0.5
  min_silence_ms: 700         # пауза, после которой фраза считается законченной
  speech_pad_ms: 800           # запас звука ДО начала речи — чтобы не обрезать первый слог «Колсон»
  min_speech_ms: 350
  max_segment_s: 25
  barge_in: true              # «Колсон, стоп» перебивает ответ (лучше работает в наушниках)

stt:
  engine: parakeet            # parakeet (быстро, почти не грузит GPU) | whisper (запасной)
  parakeet_model: mlx-community/parakeet-tdt-0.6b-v3
  min_confidence: 0.35        # ниже — считаем шумом (для parakeet)
  languages: [ru, en]
  # --- whisper ---
  model: mlx-community/whisper-large-v3-turbo
  initial_prompt: "Колсон, открой Стим. Колсон, включи ВПН. Coulson, open Safari."

llm:
  host: http://127.0.0.1:11434
  # Qwen3-VL 8B Instruct: зрение + инструменты в одной модели, обычная архитектура внимания —
  # Ollama кэширует постоянную часть промпта, поэтому ответ начинается ~за секунду.
  # (qwen3.5:9b умнее, но гибридная архитектура ломает кэш → 15–25 с на каждую реплику на M1 Pro.)
  model: qwen3-vl:8b-instruct
  vision_model: null          # null = та же модель (она мультимодальная)
  think: null                 # null = не передавать; для qwen3.5 обязательно false
  num_ctx: 12288
  temperature: 0.6
  keep_alive: 60m             # после часа простоя модель выгружается (~7 ГБ памяти)
  unload_on_game: true        # запустил игру — модель выгружается, память отдаётся игре
  max_tool_rounds: 20         # шагов (вызовов инструментов) на одну просьбу — для задач по плану
  history_turns: 10

tts:
  engine: silero              # silero | say | qwen3
  silero_model: v5_ru
  silero_speaker: aidar       # мужские: aidar, eugene
  sample_rate: 48000
  say_en_voice: Daniel        # британский голос macOS
  say_ru_voice: auto          # auto = лучший установленный русский голос macOS (запасной)
  say_rate: 190
  # --- экспериментально: Qwen3-TTS (uv sync --extra qwen3tts) ---
  qwen3_model: mlx-community/Qwen3-TTS-12Hz-0.6B-Base-bf16
  qwen3_ref_audio: null       # WAV-образец голоса для клонирования (scripts/make_voice_ref.sh)
  qwen3_ref_text: null

browser:
  app: Yandex                 # имя приложения браузера (/Applications/Yandex.app)

files:
  workspace: ~/Documents/Колсон   # куда сохраняются созданные файлы, если путь не указан

apps:
  aliases:                    # как ты называешь приложение -> как оно называется на диске
    телега: Telegram
    браузер: Yandex
    яндекс: Yandex
    музыка: Music
    терминал: Terminal
    настройки: System Settings

vpn:
  method: none                # none | scutil | shortcut | app
  name: ""                    # имя VPN-подключения / команды Shortcuts / приложения

safety:
  confirm_risky: true         # опасные действия только после голосового «да»

memory:
  max_facts: 40
  embed_model: qwen3-embedding:0.6b   # поиск по смыслу (~0.6 ГБ); null — только поиск по словам
  auto_recall: true           # подмешивать к каждой команде похожие записи из памяти
  recall_top_k: 3
  recall_min_similarity: 0.55 # 0..1: ниже — считаем не относящимся к делу

vision:
  max_width: 1440

ui:
  enabled: true
  position: top-right         # top-right | bottom-right
  collapse_after_seconds: 6
  mood_hold_seconds: 10       # сколько шар остаётся красноватым после плохой новости
