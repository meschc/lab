<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Колсон</title>
<style>
  :root {
    --glass: rgba(18, 18, 26, 0.86);
    --stroke: rgba(255, 255, 255, 0.09);
    --text: #f4f4f7;
    --muted: rgba(235, 235, 245, 0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; color: var(--text); }

  .panel { position: absolute; inset: 6px; border-radius: 26px; background: var(--glass);
    border: 1px solid var(--stroke); box-shadow: 0 10px 40px rgba(0,0,0,.45);
    display: flex; align-items: center; gap: 14px; padding: 12px 16px 12px 12px;
    transition: border-radius .35s ease; }
  body.collapsed .panel { border-radius: 50%; padding: 0; justify-content: center; }
  body.collapsed .text, body.collapsed .controls { display: none; }

  /* ---------- шар: живой переливающийся градиент ---------- */
  @property --c1 { syntax: "<color>"; inherits: true; initial-value: #2f9bff; }
  @property --c2 { syntax: "<color>"; inherits: true; initial-value: #5fd0ff; }
  @property --c3 { syntax: "<color>"; inherits: true; initial-value: #0a3bd6; }
  @property --c4 { syntax: "<color>"; inherits: true; initial-value: #d8f7ff; }
  @property --a  { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  /* настроение: 0 — голубой, 0.5 — заметно краснее, 1 — красный; меняется плавно */
  @property --m  { syntax: "<number>"; inherits: true; initial-value: 0; }
  body { --c1: #2f9bff; --c2: #5fd0ff; --c3: #0a3bd6; --c4: #d8f7ff;
    --m: 0; --r1: #ff3344; --r2: #ff6b57; --r3: #b3002d; --r4: #ffb3b3;
    transition: --c1 .9s ease, --c2 .9s ease, --c3 .9s ease, --c4 .9s ease, --m 1.2s ease; }
  .orb-wrap {
    /* два пятна краснеют к уровню 0.5, два других — от 0.5 до 1: на «предупреждении» в шаре
       закручиваются красный и голубой, на «ошибке» он весь красный. oklch сохраняет сочность цвета */
    --k1: color-mix(in oklch, var(--c1), var(--r1) clamp(0%, var(--m) * 200%, 100%));
    --k3: color-mix(in oklch, var(--c3), var(--r3) clamp(0%, var(--m) * 200%, 100%));
    --k2: color-mix(in oklch, var(--c2), var(--r2) clamp(0%, (var(--m) - 0.5) * 200%, 100%));
    --k4: color-mix(in oklch, var(--c4), var(--r4) clamp(0%, (var(--m) - 0.5) * 200%, 100%)); }

  /* все размеры шара в em: 1em = диаметр, поэтому он одинаково красиво масштабируется */
  .orb-wrap { position: relative; font-size: 60px; width: 1em; height: 1em; flex: none; cursor: default; }
  .glow { position: absolute; inset: -.08em; border-radius: 50%; opacity: .35;
    background: conic-gradient(from var(--a), var(--k1), var(--k2), var(--k3), var(--k4), var(--k1));
    filter: blur(.16em) saturate(1.3); animation: spin 9s linear infinite;
    transition: opacity .6s, transform .12s linear; transform: scale(var(--s, .9)); }
  .orb { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; isolation: isolate;
    background: radial-gradient(circle at 50% 60%, #0b2448, #04101f 80%); filter: saturate(1.25) contrast(1.05);
    transform: scale(var(--s, .9)); transition: transform .12s linear, filter .6s, opacity .6s; }
  .swirl { position: absolute; inset: -30%;
    background: conic-gradient(from var(--a), var(--k1), var(--k2), var(--k3), var(--k4), var(--k1));
    filter: blur(.1em); animation: spin 6s linear infinite; opacity: .6; transition: opacity .6s; }
  .blob { position: absolute; top: 14%; left: 14%; width: 72%; height: 72%; border-radius: 50%;
    filter: blur(.09em); opacity: .9; }
  .b1 { background: radial-gradient(circle, var(--k1) 0%, transparent 62%); animation: d1 7.3s ease-in-out infinite; }
  .b2 { background: radial-gradient(circle, var(--k2) 0%, transparent 62%); animation: d2 8.9s ease-in-out infinite; }
  .b3 { background: radial-gradient(circle, var(--k3) 0%, transparent 62%); animation: d3 6.1s ease-in-out infinite; }
  .b4 { background: radial-gradient(circle, var(--k4) 0%, transparent 62%); animation: d4 10.7s ease-in-out infinite; }
  .vignette { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 48%, rgba(5,5,15,.55) 100%); }
  .shine { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(ellipse 34% 22% at 36% 22%, rgba(255,255,255,.55), rgba(255,255,255,0) 100%);
    box-shadow: inset 0 0 0 .015em rgba(255,255,255,.18), inset 0 -.14em .25em rgba(0,0,0,.35); }

  @keyframes spin { to { --a: 360deg; } }
  @keyframes d1 { 0%,100% { transform: translate(-18%,-14%) scale(1); }   33% { transform: translate(28%,-6%) scale(1.15); }
                  66% { transform: translate(6%,30%) scale(.9); } }
  @keyframes d2 { 0%,100% { transform: translate(34%,26%) scale(1.1); }   40% { transform: translate(-16%,30%) scale(.85); }
                  70% { transform: translate(20%,-18%) scale(1.2); } }
  @keyframes d3 { 0%,100% { transform: translate(8%,36%) scale(.9); }     50% { transform: translate(-22%,-20%) scale(1.2); } }
  @keyframes d4 { 0%,100% { transform: translate(30%,-22%) scale(1); }    30% { transform: translate(-20%,4%) scale(1.25); }
                  75% { transform: translate(24%,32%) scale(.8); } }
  @keyframes breathe { 0%,100% { opacity: .35 } 50% { opacity: .85 } }

  /* все состояния голубые: различаются оттенком, яркостью и активностью (скорость анимаций не скачет) */
  body.idle      { --c1: #2f9bff; --c2: #5fd0ff; --c3: #0a3bd6; --c4: #d8f7ff; }  /* спокойный голубой */
  body.loading   { --c1: #3a78c2; --c2: #4fa6d8; --c3: #2a4f99; --c4: #86c4e6; }  /* приглушённый */
  body.listening { --c1: #00c8ff; --c2: #52e0ff; --c3: #0b5fe0; --c4: #e6fbff; }  /* яркий, ближе к циану */
  body.thinking  { --c1: #1f6bff; --c2: #3fb4ff; --c3: #2a2fd8; --c4: #b5e6ff; }  /* глубже, с каплей индиго */
  body.speaking  { --c1: #38bdf8; --c2: #7dd8ff; --c3: #0a6fd0; --c4: #f0fbff; }  /* светлый, почти ледяной */
  body.idle .glow { opacity: .28; }
  body.loading .orb { opacity: .7; }
  body.loading .glow { animation: spin 9s linear infinite, breathe 2s ease-in-out infinite; }
  body.listening .glow { opacity: .8; animation: spin 9s linear infinite, breathe 1.6s ease-in-out infinite; }
  body.thinking .swirl { opacity: 1; animation-duration: 6s; }
  body.thinking .glow { opacity: .75; animation: spin 9s linear infinite, breathe 1s ease-in-out infinite; }
  body.speaking .glow { opacity: .7; }
  body.muted .orb, body.sleeping .orb { filter: grayscale(1) brightness(.7); opacity: .55; }
  body.muted .glow, body.sleeping .glow { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .blob, .swirl, .glow { animation-duration: 40s !important; }
  }

  /* ---------- текст ---------- */
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .status { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .user { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user.ignored { opacity: .45; font-style: italic; }
  .reply { font-size: 14.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden; }

  .controls { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; opacity: 0; transition: opacity .2s; }
  .panel:hover .controls { opacity: 1; }
  button { width: 22px; height: 22px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.1); color: var(--text); font-size: 11px; display: grid; place-items: center; }
  button:hover { background: rgba(255,255,255,.22); }
  button.off { background: #ff453a; }
</style>
</head>
<body class="loading">
  <div class="panel">
    <div class="orb-wrap" id="orb" title="Двойной клик — микрофон вкл/выкл">
      <div class="glow"></div>
      <div class="orb">
        <div class="swirl"></div>
        <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
        <div class="vignette"></div>
        <div class="shine"></div>
      </div>
    </div>
    <div class="text">
      <div class="status" id="status">Загрузка…</div>
      <div class="user" id="user"></div>
      <div class="reply" id="reply"></div>
    </div>
    <div class="controls">
      <button id="mic" title="Микрофон">●</button>
      <button id="stop" title="Замолчать">■</button>
      <button id="collapse" title="Свернуть">–</button>
    </div>
  </div>
<script>
  const STATUS = { idle: "Скажите «Колсон»", listening: "Слушаю…", thinking: "Думаю…", speaking: "Говорю",
                   loading: "Загрузка…", muted: "Микрофон выключен", sleeping: "Сплю" };
  const $ = (id) => document.getElementById(id);
  const wrap = $("orb");
  let state = "loading";

  const api = () => (window.pywebview && window.pywebview.api) || null;

  window.ui = {
    setState(s, detail) {
      state = s;
      document.body.classList.remove(...Object.keys(STATUS));
      document.body.classList.add(s);
      $("status").textContent = detail ? `${STATUS[s] || s} · ${detail}` : (STATUS[s] || s);
      if (s !== "listening" && s !== "speaking") wrap.style.setProperty("--s", ".9");
    },
    setLevel(v) {
      if (state === "listening" || state === "idle") wrap.style.setProperty("--s", (0.9 + v * 0.18).toFixed(3));
    },
    user(text, accepted) {
      $("user").textContent = text ? `«${text}»` : "";
      $("user").classList.toggle("ignored", !accepted);
    },
    reply(text) { $("reply").textContent = text; },
    mic(on) { micOn = on; $("mic").classList.toggle("off", !on); },
    mood(v) { document.body.style.setProperty("--m", String(Math.max(0, Math.min(1, v)))); },
    collapsed(on) { document.body.classList.toggle("collapsed", on); },
  };

  // «говорящий» шар пульсирует сам — уровень сигнала TTS мы не передаём
  setInterval(() => {
    if (state === "speaking") wrap.style.setProperty("--s", (0.9 + Math.random() * 0.12).toFixed(3));
  }, 110);

  let micOn = true;
  $("mic").onclick = () => { micOn = !micOn; api()?.toggle_mic(micOn); };
  $("orb").ondblclick = () => { micOn = !micOn; api()?.toggle_mic(micOn); };
  $("stop").onclick = () => api()?.stop();
  $("collapse").onclick = () => api()?.collapse(true);
  document.querySelector(".panel").onclick = (e) => {
    if (document.body.classList.contains("collapsed")) api()?.collapse(false);
  };
</script>
</body>
</html>
