name: ZERNO
options:
  bundleIdPrefix: ru.kirmesch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: $(ZERNO_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  ZERNO:
    type: application
    platform: iOS
    sources:
      - path: ZERNO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kirmesch.zerno
        PRODUCT_NAME: ZERNO
        INFOPLIST_FILE: ZERNO/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ZERNO/Info.plist

schemes:
  ZERNO:
    build:
      targets:
        ZERNO: all
    run:
      config: Debug
    archive:
      config: Release
