<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Личная рулетка кино: случайный фильм или сериал из моего списка «Буду смотреть» на Кинопоиске.">
<meta name="robots" content="noindex">
<title>Что посмотреть</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23000'/><circle cx='50' cy='50' r='23' fill='none' stroke='%23fff' stroke-width='6'/><circle cx='50' cy='50' r='6' fill='%23fff'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="ambient__art" id="ambientArt"></div>
  <div class="ambient__veil"></div>
</div>

<main class="app">
  <!-- ЭКРАН: РУЛЕТКА -->
  <section class="screen is-active" id="screen-roll">
    <header class="head">
      <h1 class="title">Что посмотреть</h1>
      <p class="lede" id="poolInfo">—</p>
    </header>

    <div class="seg" id="kindSeg" role="tablist">
      <button class="seg__btn is-on" data-kind="all" role="tab">Всё</button>
      <button class="seg__btn" data-kind="film" role="tab">Фильмы</button>
      <button class="seg__btn" data-kind="series" role="tab">Сериалы</button>
    </div>

    <div class="moods" id="moods"></div>

    <div class="stage">
      <article class="card card--empty" id="card">
        <div class="card__hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="8.6" cy="8.6" r="1.25" fill="currentColor" stroke="none"/>
            <circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none"/>
            <circle cx="15.4" cy="15.4" r="1.25" fill="currentColor" stroke="none"/>
          </svg>
          <p>Нажми «Крутить» — выберу за тебя</p>
        </div>
      </article>
    </div>

    <div class="actions">
      <button class="btn btn--white" id="rollBtn"><span class="btn__label">Крутить</span></button>
      <button class="btn btn--icon" id="seenBtn" disabled aria-label="Отметить просмотренным" title="Смотрел">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.8l4.4 4.4L19 7.6"/>
        </svg>
      </button>
      <button class="btn btn--icon" id="kpBtn" disabled aria-label="Открыть на Кинопоиске" title="Кинопоиск">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M18 14.5V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V8a1.5 1.5 0 0 1 1.5-1.5H10"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- ЭКРАН: КАТАЛОГ -->
  <section class="screen" id="screen-list">
    <header class="head head--sm">
      <h2 class="title title--sm">Список</h2>
    </header>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/>
      </svg>
      <input type="search" id="q" placeholder="Название, год, жанр" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="seg" id="listSeg">
      <button class="seg__btn is-on" data-scope="watch">Буду смотреть</button>
      <button class="seg__btn" data-scope="seen">Просмотрено</button>
    </div>
    <p class="lede lede--row" id="listMeta">—</p>
    <div class="grid" id="grid"></div>
    <button class="btn btn--fill more" id="moreBtn" hidden>Показать ещё</button>
  </section>

  <!-- ЭКРАН: ПРОФИЛЬ -->
  <section class="screen" id="screen-me">
    <header class="head head--sm">
      <h2 class="title title--sm">Профиль</h2>
    </header>
    <div class="stats" id="stats"></div>
    <div id="syncBox"></div>
    <h3 class="sub">Любимые жанры</h3>
    <div class="panel bars" id="genreBars"></div>
    <h3 class="sub">Мои десятки</h3>
    <div class="row" id="tens"></div>
    <h3 class="sub">Как я оцениваю</h3>
    <div class="panel votebars" id="voteBars"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="tabbar__btn is-on" data-screen="roll">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="8.6" cy="8.6" r="1.35" fill="currentColor" stroke="none"/>
      <circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/>
      <circle cx="15.4" cy="15.4" r="1.35" fill="currentColor" stroke="none"/>
    </svg>Рулетка
  </button>
  <button class="tabbar__btn" data-screen="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="16" rx="2"/>
    </svg>Список
  </button>
  <button class="tabbar__btn" data-screen="me">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M5 20v-7M12 20V5M19 20v-4"/>
    </svg>Профиль
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
