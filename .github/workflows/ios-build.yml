# Проверка сборки: компилирует приложение под симулятор без подписи.
# Никаких секретов и учётной записи Apple не требуется — нужна только
# macOS-машина, поэтому эта проверка гоняется на каждый пуш.

name: Сборка iOS

on:
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode
        # Берём самый свежий Xcode на раннере: у более старого SDK не совпадают
        # версии с установленными runtime симулятора, и actool отказывается
        # собирать каталог ассетов.
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Xcode: $latest"
          sudo xcode-select -switch "$latest"
          xcodebuild -version

      - name: Поставить XcodeGen
        run: brew install xcodegen

      - name: Собрать проект из project.yml
        working-directory: apps/ios
        env:
          ZERNO_TEAM_ID: ""
        run: xcodegen generate

      - name: Скомпилировать под устройство
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project ZERNO.xcodeproj \
            -scheme ZERNO \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""
