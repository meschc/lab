<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Сто двадцать четыре понятия из математики, физики, биологии, информатики, теории игр, психологии и философии — с живыми линейными схемами, справками и вопросами «что если».">
<title>Мысль</title>
<link rel="canonical" href="https://create.kirmesch.ru/mind/">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Мысль">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="Мысль">
<meta property="og:description" content="Сто двадцать четыре понятия из математики, физики, биологии, информатики, теории игр, психологии и философии — с живыми линейными схемами, справками и вопросами «что если».">
<meta property="og:url" content="https://create.kirmesch.ru/mind/">
<meta property="og:image" content="https://create.kirmesch.ru/mind/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Мысль — понятия науки и философии в живых линейных схемах">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/MinipaxLining-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/MinipaxLining-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="catalog" id="catalog" hidden>
  <header class="cat-head">
    <div class="wordmark">
      <button class="search-btn" id="searchBtn" aria-label="поиск" title="поиск" aria-expanded="false" aria-controls="search">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.4 10.4 3.6 3.6"/></svg>
      </button>
      <h1 class="wordmark__name"><button class="wordmark__word" id="searchWord" title="поиск">Мысль</button></h1>
      <input class="search" id="search" type="search" placeholder="поиск" aria-label="поиск по терминам" autocomplete="off" spellcheck="false" hidden>
    </div>
    <p class="cat-lede">сто двадцать четыре понятия из математики, физики, биологии, информатики, теории игр, психологии и философии. Живые схемы и вопросы «что если».</p>
    <div class="cat-bar">
      <nav class="cat-go" aria-label="Генератор">
        <button class="cat-go__btn" data-go="term">случайный термин</button>
        <button class="cat-go__btn" data-go="theory">теория</button>
        <button class="cat-go__btn" data-go="whatif">что если…</button>
      </nav>
    </div>
    <div class="cat-filters">
      <div class="filter" id="filter" role="group" aria-label="Область"></div>
      <div class="views" role="tablist" aria-label="Вид каталога">
        <button class="seg__btn view-btn is-on" role="tab" data-view="anim" aria-selected="true" aria-label="анимации" title="анимации">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.6"/></svg>
        </button>
        <button class="seg__btn view-btn" role="tab" data-view="text" aria-selected="false" aria-label="тексты" title="тексты">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h7"/></svg>
        </button>
      </div>
    </div>
  </header>
  <div class="grid-wrap"><div class="grid" id="grid"></div><p class="grid-empty" id="gridEmpty" hidden>ничего не нашлось</p></div>
</div>

<main class="app" id="gen" hidden>
  <header class="top">
    <a class="brand" href="./" id="homeLink" aria-label="К каталогу" title="К каталогу">
      Мысль
    </a>
    <nav class="seg" role="tablist" aria-label="Ветка">
      <button class="seg__btn is-on" role="tab" data-branch="term" aria-selected="true">термин</button>
      <button class="seg__btn" role="tab" data-branch="theory" aria-selected="false">теория</button>
      <button class="seg__btn" role="tab" data-branch="whatif" aria-selected="false">что если…</button>
    </nav>
  </header>

  <section class="controls" id="controls">
    <div class="chips" id="areas" role="group" aria-label="Область"></div>
    <div class="axes" id="axes" hidden></div>
  </section>

  <section class="riddle" aria-live="polite">
    <p class="eyebrow" id="eyebrow">—</p>
    <div class="riddle__row">
      <span class="riddle__num" id="termNum" aria-hidden="true"></span>
      <h1 class="headline" id="headline">—</h1>
      <button class="btn btn--icon" id="cardBtn" title="скачать карточку 9:16" aria-label="скачать карточку 9:16">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>
      </button>
    </div>
  </section>

  <section class="reveal" id="reveal" aria-labelledby="revealTitle">
    <div class="reveal__head">
      <h2 class="reveal__title" id="revealTitle"></h2>
      <button class="btn reveal__close" id="revealClose">закрыть</button>
    </div>
    <p class="reveal__text" id="revealText"></p>
    <p class="reveal__more" id="revealMore"></p>
  </section>

  <div class="stage">
    <canvas id="stage" aria-label="Визуализация" role="img"></canvas>
  </div>

  <div class="actions">
    <button class="btn btn--ink" id="nextBtn">ещё</button>
    <button class="btn" id="revealBtn" aria-expanded="false" aria-controls="reveal">раскрыть</button>
    <button class="btn" id="backBtn">назад</button>
    <div class="links" id="links"></div>
  </div>

</main>
<noscript><p style="padding:24px 20px">«Мысль» рисует схемы на JavaScript — включите его в браузере.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
